server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Web manifest and service worker must not be cached aggressively.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; }
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        types { application/javascript js; }
    }

    # Static assets with content hashes can be cached forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: Next export emits s.html for /s, so try $uri.html before
    # the directory index, then fall back to the app shell for unknown paths.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
