name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The integration harness builds the openlist-ext binary from the
          # sibling openlist directory, so we need it checked out too.
          path: pshare
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openlist
          path: openlist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: pshare/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: openlist/go.sum
      - name: Build openlist-ext
        working-directory: openlist
        run: go build -o ${{ github.workspace }}/openlist-ext .
      - name: Install, build, test
        working-directory: pshare
        env:
          PSHARE_INTEGRATION: "1"
          OPENLIST_SRC: ${{ github.workspace }}/openlist
          OPENLIST_BIN: ${{ github.workspace }}/openlist-ext
        run: |
          npm ci
          npm run build
          npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pshare
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openlist
          path: openlist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: pshare/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: openlist/go.sum
      - name: Build openlist-ext
        working-directory: openlist
        run: go build -o ${{ github.workspace }}/openlist-ext .
      - name: Install, build, test
        working-directory: pshare
        env:
          OPENLIST_SRC: ${{ github.workspace }}/openlist
          OPENLIST_BIN: ${{ github.workspace }}/openlist-ext
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

  # Build and publish a multi-arch (amd64, arm64) static-site image to GHCR.
  # The image is nginx serving the static export; the OpenList API key is a
  # build arg inlined into the bundle. Only publishes on push to main (PRs
  # build but don't push).
  #
  # arm/v7 (32-bit armhf) is intentionally excluded: Next.js does not publish
  # a SWC native binary for linux-arm-gnueabihf, so `next build` fails with a
  # 404 downloading @next/swc-linux-arm-gnueabihf. amd64 and arm64 (both 64-bit)
  # have SWC binaries and cover all realistic deployment targets.
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pshare
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The API key is a low-privilege, scope-limited OpenList key. Provide
          # it via repository secrets at build time; empty here so PR builds
          # (which don't push) still succeed with a placeholder.
          build-args: |
            NEXT_PUBLIC_OPENLIST_BASE_URL=${{ secrets.OPENLIST_BASE_URL }}
            NEXT_PUBLIC_OPENLIST_API_KEY=${{ secrets.OPENLIST_API_KEY }}
            NEXT_PUBLIC_OPENLIST_MOUNT_PATH=${{ vars.OPENLIST_MOUNT_PATH || '/pshare' }}
            NEXT_PUBLIC_PSHARE_DEFAULT_TTL=${{ vars.OPENLIST_DEFAULT_TTL || '86400' }}
            NEXT_PUBLIC_PSHARE_DEFAULT_TTL_LABEL=${{ vars.OPENLIST_DEFAULT_TTL_LABEL || '1 day' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
