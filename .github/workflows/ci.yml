name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The integration harness builds the openlist-ext binary from the
          # sibling openlist directory, so we need it checked out too.
          path: pshare
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openlist
          path: openlist
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: pshare/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: openlist/go.sum
      - name: Build openlist-ext
        working-directory: openlist
        run: go build -o ${{ github.workspace }}/openlist-ext .
      - name: Install, build, test
        working-directory: pshare
        env:
          PSHARE_INTEGRATION: "1"
          OPENLIST_SRC: ${{ github.workspace }}/openlist
          OPENLIST_BIN: ${{ github.workspace }}/openlist-ext
        run: |
          npm ci
          npm run build
          npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: pshare
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/openlist
          path: openlist
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: pshare/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: openlist/go.sum
      - name: Build openlist-ext
        working-directory: openlist
        run: go build -o ${{ github.workspace }}/openlist-ext .
      - name: Install, build, test
        working-directory: pshare
        env:
          OPENLIST_SRC: ${{ github.workspace }}/openlist
          OPENLIST_BIN: ${{ github.workspace }}/openlist-ext
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
